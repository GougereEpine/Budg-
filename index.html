<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e8536b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Budg'" />
    <title>Budg' — budget de couple</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <main id="view" aria-live="polite"></main>
      <nav id="tabs" hidden>
        <button data-tab="home"><span>🏡</span>Accueil</button>
        <button data-tab="expenses"><span>🧾</span>Dépenses</button>
        <button data-tab="add" class="fab" aria-label="Ajouter une dépense">＋</button>
        <button data-tab="fixed"><span>🔁</span>Fixes</button>
        <button data-tab="budget"><span>📊</span>Analyse</button>
      </nav>
    </div>

    <dialog id="modal">
      <form method="dialog" id="modal-form"></form>
    </dialog>
    <div id="toast" role="status" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="config.js"></script>
    <script src="logic.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
  </body>
</html>
